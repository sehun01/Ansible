---
    ###################################
    # 1) 패키지 설치 - httpd, firewalld
    # 2) 웹서버 설정 - /var/www/html/index.html
    # 3) 웹서비스 기동 - httpd.service, firewalld.service
    # 4) 방화벽 등록 - http
    ###################################
    # 2. 웹 확인 
    #  1) 웹 요청
- name: Restore intranet.yml
  hosts: all
  tasks:
      - name: 1) 방화벽 삭제 - http
    #firewall-cmd --permanent --add-service=http
        ansible.posix.firewalld:
          service: http
          permanent: true
          immediate: true
          state: disabled

      - name: 2) 웹서비스 중지 - (systemd) httpd.service
        ansible.builtin.systemd:
          name: httpd
          state: stopped
          enabled: false

      - name: 2) 웹서비스 기동 - (systemd) firewalld.service
        ansible.builtin.systemd:
          name: firewalld
          state: stopped
          enabled: false
          
      - name: 3) 파일 삭제 - /var/www/html/index.html
        ansible.builtin.file:
          path: /var/www/html/index.html
          state: absent

      - name: 4) 패키지 삭제 - (dnf) httpd, firewalld
        ansible.builtin.dnf:
          name:
            - httpd
          state: absent

