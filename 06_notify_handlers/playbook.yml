---
- name: MariaDB server is installed
  hosts: databases
  remote_user: root
  # (ansible) ansible 사용자 -- 키배포 --> (ansible#) root
  vars:
    db_packages:
      - mariadb-server
      - python3-PyMySQL
    db_service: mariadb
    resources_url: http://ansible.example.com
    config_file_url: "{{ resources_url }}/my.cnf.standard"
    config_file_dst: /etc/my.cnf
  tasks:
    - name: 1) "{{ db_packages }} - mariadb, mariadb-server, python3-PymYSQL"
      ansible.builtin.dnf:
        name: "{{ db_packages }}"
        state: present

    - name: 2) Make sure the database service is running
      ansible.builtin.service:
        name: "{{ db_service }}"
        state: started
        enabled: true
      notify:
        - set db password

    - name: 3) The {{ config_file_dst }} file has been installed
      ansible.builtin.get_url:
        url: "{{ config_file_url }}"
        dest: "{{ config_file_dst }}"
        owner: root
        group: root
        force: yes
      notify:
        - restart db service

  handlers:
    - name: restart db service
      ansible.builtin.service:
        name: "{{ db_service }}"
        state: restarted

    - name: set db password
      ansible.mysql.mysql_user:
        name: root
        password: soldesk1.
        priv: '*.*:ALL'
        state: present
        login_user: root
        login_password: 'soldesk1.'
        login_unix_socket: /var/lib/mysql/mysql.sock

