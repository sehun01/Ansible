---
- name: 0) 웹서버 설정
  hosts: webservers
#- hosts: web1.example.com:web2.example.com
  tasks: 
    - name: 1) 패키지 설치 - (yum.duf) httpd
      ansible.builtin.dnf:
        name: httpd
        state: present
#(ㄱ) 패키지 설치
# yum install httpd
#(ㄴ) 서비스 설정
# cp files/index.html /var/www/html/index.html
#(ㄷ) 서비스 기동
# systemctl enable --now httpd
#(ㄹ) 방화벽 기동 및 등록
# firewall-cmd --permanent --add-service=http
# firewall-cmd --reload

    - name: 2) 웹 서버 설정 - (copy) /var/www/html/index.html
      ansible.builtin.copy:
        # scp files/index.html HOST:/var/www/html/index.html
        content: 'My WEB Server\n'
        dest: /var/www/html/index.html
#3) 웹 서비스 기동 
    - name: 3) 웹 서비스 기동 - (service,systemd) httpd.service
      ansible.builtin.service:
        # systemctl enable --now httpd.service
        name: httpd
        state: started
        enabled: true
        
#4) 방화벽 등록
    - name: 4) 방화벽 등록
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled